<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter+Tight:wght@400;500;600&display=swap" media="print" onload="this.media=\'all\'">
<style>
/* Liste type messagerie : rangée de recueils, recherche, cantiques numérotés, barre pilule en bas */
:root{--bg:#000;--fg:#f4f1ee;--mut:#8e8a86;--chip:#1c1b1a;--chip-on:#2c2a28;--line:#2a2826;--acc:#ff6a1a;
--disp:"Fraunces",Georgia,serif;--sans:"Inter Tight",system-ui,sans-serif;color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#fbfaf8;--fg:#141312;--mut:#77726d;--chip:#f0eeeb;--chip-on:#e3e0dc;--line:#e6e3df;--acc:#e0560c;color-scheme:light}}
:root[data-theme="light"]{--bg:#fbfaf8;--fg:#141312;--mut:#77726d;--chip:#f0eeeb;--chip-on:#e3e0dc;--line:#e6e3df;--acc:#e0560c;color-scheme:light}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px var(--sans)}
main{max-width:640px;margin:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 110px}
header{display:flex;justify-content:space-between;align-items:center}
h1{font:600 clamp(28px,8vw,34px) var(--disp);margin:0}
#bt{font-size:clamp(22px,6vw,28px);line-height:1.2;margin:4px 0 8px;overflow-wrap:anywhere}
.ic{width:40px;height:40px;border:0;background:none;color:var(--acc);cursor:pointer}
.books{display:flex;gap:16px;overflow-x:auto;padding:16px 0 6px;scrollbar-width:none}
.bk{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;width:72px;border:0;background:none;color:var(--fg);font:500 12px var(--sans);cursor:pointer}
.bk i{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:600 18px var(--disp);font-style:normal;background:var(--chip);border:2px solid var(--line)}
.bk.on i{border-color:var(--acc);box-shadow:inset 0 0 0 3px var(--bg);color:var(--acc)}
.bk.off{opacity:.45}
.bk span{text-align:center;line-height:1.2}
.srch{display:flex;align-items:center;gap:10px;background:var(--chip);border-radius:16px;padding:12px 16px;margin:14px 0 10px}
.srch input{flex:1;min-width:0;border:0;background:none;color:var(--fg);font:16px var(--sans);outline:0}
ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
li{display:flex;gap:14px;align-items:center;padding:14px 10px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:14px}
li.on{background:var(--chip)}
.n{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--chip-on);font:600 18px var(--disp);font-variant-numeric:tabular-nums}
li.on .n{background:var(--acc);color:#fff}
.t{flex:1;min-width:0}
.t b{display:block;font-weight:600;font-size:16px}
.t span{display:block;color:var(--mut);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fav{color:var(--acc);font-size:15px}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:10px;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px) * .35) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(transparent,var(--bg) 40%)}
.tabs{display:flex;background:var(--chip);border:1px solid var(--line);border-radius:40px;padding:4px}
.tabs button{border:0;background:none;color:var(--fg);font:600 12px var(--sans);border-radius:36px;padding:7px 18px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.tabs button.on{background:var(--chip-on);color:var(--acc)}
.tabs svg,.round svg{width:24px;height:24px}
.round{width:58px;height:58px;border-radius:29px;border:1px solid var(--line);background:var(--chip);color:var(--fg);display:grid;place-items:center;cursor:pointer}
.note{color:var(--mut);font-size:12px;text-align:center;margin-top:14px}
button:focus-visible,li:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.view[hidden]{display:none}
.rd header{gap:8px;justify-content:flex-start}
.rd h2{font:600 clamp(22px,6vw,28px) var(--disp);margin:0;flex:1;text-wrap:balance}
.big{font:600 15px var(--sans);color:var(--acc);margin-top:18px}
.st{white-space:pre-line;line-height:1.7;font-size:calc(var(--fs,18) * 1px);margin:14px 0}
.st small{display:block;color:var(--acc);font:600 12px var(--sans);letter-spacing:.06em}
.rf{font-style:italic;padding-left:14px;border-left:2px solid var(--acc)}
.set label{display:flex;justify-content:space-between;align-items:center;padding:16px 4px;border-bottom:1px solid var(--line)}
.set input[type=range]{width:50%}
.empty{color:var(--mut);text-align:center;padding:40px 10px}
.dlg{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:16px}
.dlg div{background:var(--chip);border-radius:20px;padding:20px;width:min(320px,100%);display:grid;gap:12px}

.lcin{margin:22px 0 0;padding:34px 24px 30px;border-radius:28px;background:var(--chip);border:1px solid var(--line);text-align:center;display:flex;flex-direction:column;align-items:center}
.lcin .lcm{width:30px;height:64px}
.lcin b{font-family:var(--disp);font-size:26px;letter-spacing:-.01em;margin:18px 0 8px;line-height:1.2}
.lcin p{margin:0 0 24px;color:var(--mut);font-size:15px;line-height:1.5;max-width:300px}
